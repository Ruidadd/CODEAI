<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI选股器 - 智能股票分析</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                    </svg>
                    AI选股器
                </h1>
            </div>

            <div class="sidebar-content">
                <button class="new-chat-btn" onclick="resetAnalysis()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    新建分析
                </button>

                <div class="history-section">
                    <h3>分析历史</h3>
                    <div id="historyList" class="history-list">
                        <!-- 历史记录将动态添加 -->
                    </div>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">AI</div>
                    <span>选股助手</span>
                </div>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <div class="chat-container">
                <!-- 欢迎界面 -->
                <div id="welcomeScreen" class="welcome-screen">
                    <div class="welcome-content">
                        <h2>AI驱动的智能选股分析</h2>
                        <p>上传股票图表截图，AI将为您提供专业的分析建议</p>

                        <div class="feature-cards">
                            <div class="feature-card">
                                <div class="feature-icon">📊</div>
                                <h3>技术分析</h3>
                                <p>识别图表形态和技术指标</p>
                            </div>
                            <div class="feature-card">
                                <div class="feature-icon">📈</div>
                                <h3>趋势判断</h3>
                                <p>分析价格趋势和支撑阻力</p>
                            </div>
                            <div class="feature-card">
                                <div class="feature-icon">💡</div>
                                <h3>投资建议</h3>
                                <p>提供买入卖出策略建议</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 分析结果区域 -->
                <div id="analysisArea" class="analysis-area hidden">
                    <div id="messages" class="messages">
                        <!-- 消息将动态添加 -->
                    </div>
                </div>

                <!-- 输入区域 -->
                <div class="input-area">
                    <div class="input-container">
                        <div id="imagePreview" class="image-preview hidden">
                            <img id="previewImg" src="" alt="预览">
                            <button class="remove-image" onclick="removeImage()">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M18 6L6 18M6 6l12 12"/>
                                </svg>
                            </button>
                        </div>

                        <div class="input-wrapper">
                            <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
                            <button class="upload-btn" onclick="document.getElementById('imageInput').click()" title="上传图片">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                                </svg>
                            </button>

                            <textarea
                                id="promptInput"
                                placeholder="添加额外的分析要求（可选）..."
                                rows="1"
                                onkeydown="handleKeyDown(event)"
                            ></textarea>

                            <button class="send-btn" onclick="analyzeStock()" id="sendBtn" disabled>
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
