<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>华强北元器件价格监控</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e;
    --up: #f85149; --down: #3fb950; --accent: #58a6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 18px; }
  header h1 .dot { color: var(--down); animation: blink 2s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .spacer { flex: 1; }
  .stat { font-size: 13px; color: var(--muted); }
  .stat b { color: var(--text); }
  button, input {
    background: #21262d; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 14px; font-size: 13px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: #1f6feb; border-color: #1f6feb; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  main {
    display: grid; grid-template-columns: 360px 1fr; gap: 16px;
    padding: 16px 24px; max-width: 1500px; margin: 0 auto;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden;
  }
  .panel h2 {
    font-size: 13px; color: var(--muted); font-weight: 600;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 14px; text-align: left; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tbody tr { border-top: 1px solid var(--border); }
  tbody tr:hover { background: #1c2128; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .up   { color: var(--up); }
  .down { color: var(--down); }
  .muted { color: var(--muted); }
  #partList tbody tr { cursor: pointer; }
  #partList tbody tr.active { background: #1f2937; box-shadow: inset 3px 0 0 var(--accent); }
  .price { font-weight: 600; }
  .chart-wrap { padding: 14px; height: 320px; }
  .badge {
    display: inline-block; padding: 1px 8px; border-radius: 10px;
    font-size: 11px; background: #21262d; border: 1px solid var(--border);
  }
  #alertFeed { max-height: 260px; overflow-y: auto; }
  .alert-item {
    display: flex; gap: 10px; align-items: baseline;
    padding: 8px 14px; border-top: 1px solid var(--border); font-size: 13px;
  }
  .alert-item .t { color: var(--muted); font-size: 11px; margin-left: auto; }
  .empty { padding: 24px; text-align: center; color: var(--muted); font-size: 13px; }
  .right-col { display: flex; flex-direction: column; gap: 16px; }
  #toast {
    position: fixed; bottom: 24px; right: 24px; padding: 10px 18px;
    background: #1f6feb; border-radius: 8px; font-size: 13px;
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1><span class="dot">●</span> 华强北元器件价格监控</h1>
  <span class="stat">型号 <b id="stTotal">-</b></span>
  <span class="stat">记录 <b id="stRecords">-</b></span>
  <span class="stat">告警 <b id="stAlerts">-</b></span>
  <span class="stat">最近抓取 <b id="stLastFetch">-</b></span>
  <div class="spacer"></div>
  <input id="newPart" placeholder="添加型号, 如 STM32F405RGT6" style="width:220px"
         onkeydown="if(event.key==='Enter')addPart()">
  <button onclick="addPart()">＋ 添加</button>
  <button class="primary" id="fetchBtn" onclick="triggerFetch()">⟳ 立即抓取</button>
  <span class="stat">自动刷新 <b id="countdown">30</b>s</span>
</header>

<main>
  <!-- 左栏: 型号列表 -->
  <div class="panel">
    <h2>监控型号 <span class="badge" id="partCount">0</span></h2>
    <table id="partList">
      <thead><tr><th>型号</th><th class="num">最低价(¥)</th><th class="num">环比</th><th>来源</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="empty" id="partEmpty" style="display:none">
      暂无数据 — 添加型号后点击「立即抓取」
    </div>
  </div>

  <!-- 右栏: 详情 + 走势 + 告警 -->
  <div class="right-col">
    <div class="panel">
      <h2>各来源最新报价 — <span id="detailTitle" style="color:var(--accent)">未选择</span></h2>
      <table id="priceTable">
        <thead><tr>
          <th>来源</th><th class="num">单价(¥)</th><th class="num">环比</th>
          <th class="num">起购</th><th class="num">库存</th><th>供应商</th><th>更新</th>
        </tr></thead>
        <tbody></tbody>
      </table>
      <div class="empty" id="priceEmpty">点击左侧型号查看报价详情</div>
    </div>

    <div class="panel">
      <h2>价格走势
        <select id="daysSel" onchange="loadDetail(currentPart)" style="background:#21262d;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:2px 6px">
          <option value="1">24小时</option>
          <option value="7" selected>7天</option>
          <option value="30">30天</option>
        </select>
      </h2>
      <div class="chart-wrap"><canvas id="chart"></canvas></div>
    </div>

    <div class="panel">
      <h2>价格变化告警(48h)</h2>
      <div id="alertFeed"></div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
const POLL_SECONDS = 30;
let currentPart = null, chart = null, countdown = POLL_SECONDS;

const fmtPrice = p => p == null ? '-' : Number(p).toFixed(4);
const fmtTime  = iso => iso ? iso.replace('T', ' ').slice(5, 16) : '-';
const fmtPct   = pct => {
  if (pct == null) return '<span class="muted">-</span>';
  const cls = pct > 0 ? 'up' : (pct < 0 ? 'down' : 'muted');
  const arrow = pct > 0 ? '▲' : (pct < 0 ? '▼' : '');
  return `<span class="${cls}">${arrow} ${Math.abs(pct).toFixed(2)}%</span>`;
};

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

async function getJSON(url, opts) {
  const r = await fetch(url, opts);
  return r.json();
}

// ── 统计栏 ──
async function loadStats() {
  const s = await getJSON('/api/stats');
  stTotal.textContent = s.total_components;
  stRecords.textContent = s.total_records;
  stAlerts.textContent = s.total_alerts;
  stLastFetch.textContent = s.fetch_running ? '抓取中…' : fmtTime(s.last_fetch_at);
}

// ── 型号列表 ──
async function loadParts() {
  const parts = await getJSON('/api/components');
  partCount.textContent = parts.length;
  const tbody = document.querySelector('#partList tbody');
  partEmpty.style.display = parts.length ? 'none' : '';
  tbody.innerHTML = parts.map(p => `
    <tr data-part="${p.part_number}" class="${p.part_number === currentPart ? 'active' : ''}"
        onclick="selectPart('${p.part_number}')">
      <td><b>${p.part_number}</b></td>
      <td class="num price">${fmtPrice(p.best_price)}</td>
      <td class="num">${fmtPct(p.change_pct)}</td>
      <td class="muted">${p.best_source ?? '-'}</td>
    </tr>`).join('');
  if (!currentPart && parts.length) selectPart(parts[0].part_number);
}

function selectPart(part) {
  currentPart = part;
  document.querySelectorAll('#partList tbody tr').forEach(tr =>
    tr.classList.toggle('active', tr.dataset.part === part));
  loadDetail(part);
}

// ── 详情: 报价表 + 走势图 ──
async function loadDetail(part) {
  if (!part) return;
  detailTitle.textContent = part;

  const rows = await getJSON('/api/prices/' + encodeURIComponent(part));
  const tbody = document.querySelector('#priceTable tbody');
  priceEmpty.style.display = rows.length ? 'none' : '';
  priceEmpty.textContent = rows.length ? '' : '该型号暂无报价 — 点击「立即抓取」获取';
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${r.url ? `<a href="${r.url}" target="_blank" style="color:var(--accent)">${r.source_name}</a>` : r.source_name}</td>
      <td class="num price">${fmtPrice(r.price)}</td>
      <td class="num">${fmtPct(r.change_pct)}</td>
      <td class="num">${r.min_qty ?? '-'}</td>
      <td class="num">${r.stock_qty ?? '-'}</td>
      <td class="muted">${r.supplier ?? '-'}</td>
      <td class="muted">${fmtTime(r.scraped_at)}</td>
    </tr>`).join('');

  const days = document.getElementById('daysSel').value;
  const series = await getJSON(`/api/history/${encodeURIComponent(part)}?days=${days}`);
  drawChart(series);
}

const COLORS = ['#58a6ff', '#f0883e', '#3fb950', '#d2a8ff', '#f85149', '#79c0ff'];

function drawChart(series) {
  const datasets = series.map((s, i) => ({
    label: s.source_name,
    data: s.points.map(p => ({ x: new Date(p.t + 'Z').getTime(), y: p.price })),
    borderColor: COLORS[i % COLORS.length],
    backgroundColor: COLORS[i % COLORS.length],
    tension: .25, pointRadius: 3, borderWidth: 2,
  }));
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: { datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'nearest', intersect: false },
      plugins: {
        legend: { labels: { color: '#e6edf3', boxWidth: 12 } },
        tooltip: {
          callbacks: {
            title: items => new Date(items[0].parsed.x).toLocaleString('zh-CN'),
            label: item => ` ${item.dataset.label}: ¥${item.parsed.y.toFixed(4)}`,
          }
        }
      },
      scales: {
        x: {
          type: 'linear',
          ticks: {
            color: '#8b949e', maxTicksLimit: 8,
            callback: v => {
              const d = new Date(v);
              return `${d.getMonth()+1}-${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            }
          },
          grid: { color: '#21262d' },
        },
        y: {
          ticks: { color: '#8b949e', callback: v => '¥' + v },
          grid: { color: '#21262d' },
        }
      }
    }
  });
}

// ── 告警流 ──
async function loadAlerts() {
  const alerts = await getJSON('/api/alerts?hours=48');
  const feed = document.getElementById('alertFeed');
  feed.innerHTML = alerts.length ? alerts.map(a => `
    <div class="alert-item">
      <b>${a.part_number}</b>
      <span class="muted">${a.source}</span>
      <span>¥${fmtPrice(a.old_price)} → <b class="${a.direction === 'up' ? 'up' : 'down'}">¥${fmtPrice(a.new_price)}</b></span>
      ${fmtPct(a.change_pct)}
      <span class="t">${fmtTime(a.alerted_at)}</span>
    </div>`).join('')
    : '<div class="empty">最近 48 小时无告警</div>';
}

// ── 操作 ──
async function addPart() {
  const input = document.getElementById('newPart');
  const part = input.value.trim();
  if (!part) return;
  const r = await getJSON('/api/components', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ part_number: part }),
  });
  if (r.ok) { toast(`已添加 ${r.part_number}`); input.value = ''; refreshAll(); }
  else toast(r.error || '添加失败');
}

async function triggerFetch() {
  const btn = document.getElementById('fetchBtn');
  btn.disabled = true;
  const r = await getJSON('/api/fetch', { method: 'POST' });
  toast(r.message);
  setTimeout(() => { btn.disabled = false; refreshAll(); }, 5000);
}

// ── 轮询 ──
function refreshAll() {
  loadStats(); loadParts(); loadAlerts();
  if (currentPart) loadDetail(currentPart);
}

setInterval(() => {
  countdown -= 1;
  if (countdown <= 0) { countdown = POLL_SECONDS; refreshAll(); }
  document.getElementById('countdown').textContent = countdown;
}, 1000);

refreshAll();
</script>
</body>
</html>
